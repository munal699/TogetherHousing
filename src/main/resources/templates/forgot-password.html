<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Together Group — Forgot Password</title>
  <meta name="description" content="Reset your Together Group account password." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">

<header class="tg-header" role="banner">
  <div class="tg-header-inner">
    <a class="tg-brand" href="home.html" aria-label="Together Group home">
      <img class="tg-brand-logo" src="images/Asset%201.png" alt="Together Group logo" />
      <span class="tg-brand-title">Together group</span>
    </a>

    <nav class="tg-nav" role="navigation" aria-label="Main menu">
      <ul class="tg-nav-list">
        <li><a href="home.html">Home</a></li>
        <li><a href="properties.html">Properties</a></li>
        <li><a href="services.html">Our Services</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <div class="tg-header-actions">
      <a class="tg-header-cta" href="login.html">
        <i class="fas fa-sign-in-alt"></i> Log In
      </a>
    </div>
  </div>
</header>

<main class="auth-main">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="images/Asset%201.png" alt="Together Group" />
      <h2>Account Recovery</h2>
    </div>

    <h1 class="auth-title">Reset Password</h1>
    <p class="auth-subtitle">Enter your email and we'll send reset instructions</p>

    <form class="auth-form" id="forgot-form" action="#" method="post" onsubmit="handleForgot(event)">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-icon-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" class="form-input" placeholder="name@example.com" required />
        </div>
      </div>

      <button type="submit" class="btn btn-primary auth-submit">
        Send Reset Link <i class="fas fa-paper-plane"></i>
      </button>
    </form>

    <p class="auth-bottom">
      Remember your password? <a href="login.html">Back to Login</a>
    </p>
  </div>
</main>

<footer class="tg-footer">
  <div class="tg-footer-bottom">
    <small>© <span class="js-year"></span> Together Group. All rights reserved.</small>
  </div>
</footer>

<script src="js/main.js"></script>
<script>
  function handleForgot(e) {
    e.preventDefault();
    showToast('Password reset link sent to your email!', 'success');
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 2000);
  }
</script>
</body>
</html>
